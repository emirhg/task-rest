<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>task-rest API</title>
<style>
  :root { --fg: #1d1f21; --muted: #5f6368; --bg: #ffffff; --line: #d0d4da; --code: #f3f4f6; --get: #0b6e4f; --post: #1c5fa8; --put: #9a6400; --delete: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e6e6; --muted: #a0a4a8; --bg: #161718; --line: #3a3d40; --code: #22252a; }
  }
  body { font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 16px; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { margin-bottom: 0; }
  h2 { margin-top: 2em; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .muted { color: var(--muted); }
  .op { border: 1px solid var(--line); border-radius: 6px; margin: 12px 0; overflow: hidden; }
  .op summary { padding: 8px 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .verb { font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 4px; min-width: 64px; text-align: center; font-size: 0.85em; }
  .GET { background: var(--get); } .POST { background: var(--post); } .PUT { background: var(--put); } .DELETE { background: var(--delete); }
  code, .path { font-family: ui-monospace, monospace; background: var(--code); padding: 1px 4px; border-radius: 3px; word-break: break-all; }
  .body { padding: 0 12px 12px 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
  td, th { border-top: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  pre { background: var(--code); padding: 8px; border-radius: 4px; overflow-x: auto; }
  .notice { border-left: 4px solid var(--line); padding-left: 10px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">task-rest API</h1>
  <p class="muted" id="version"></p>
  <p id="description"></p>
  <p class="notice">Machine-readable spec: <a href="docs/openapi.json"><code>docs/openapi.json</code></a>. Plain API clients get JSON from the same URLs; this page is only served to browsers.</p>
  <div id="ops"><p class="muted">Loading the API description...</p></div>
</main>
<script>
(function () {
  "use strict";

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") { node.textContent = attrs[k]; } else { node.setAttribute(k, attrs[k]); }
    });
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

  // Resolve "#/components/..." references inside the spec.
  function resolve(spec, obj) {
    if (obj && obj.$ref && obj.$ref.indexOf("#/") === 0) {
      return obj.$ref.slice(2).split("/").reduce(function (o, key) { return o[key]; }, spec);
    }
    return obj;
  }

  function describeSchema(spec, schema) {
    schema = resolve(spec, schema) || {};
    if (schema.$ref) { return schema.$ref; }
    if (schema.type === "array") { return "array of " + describeSchema(spec, schema.items); }
    return schema.type || "object";
  }

  function paramsTable(spec, params) {
    if (!params || !params.length) { return null; }
    var rows = params.map(function (p) {
      p = resolve(spec, p);
      return el("tr", {}, [
        el("td", {}, [el("code", { text: p.name })]),
        el("td", { text: p.in }),
        el("td", { text: describeSchema(spec, p.schema) + (p.required ? ", required" : "") }),
        el("td", { text: p.description || "" })
      ]);
    });
    return el("table", {}, [
      el("tr", {}, [el("th", { text: "Name" }), el("th", { text: "In" }), el("th", { text: "Type" }), el("th", { text: "Description" })])
    ].concat(rows));
  }

  function responsesList(spec, responses) {
    var items = Object.keys(responses || {}).map(function (code) {
      var r = resolve(spec, responses[code]);
      return el("li", {}, [el("strong", { text: code + " " }), el("span", { text: r.description || "" })]);
    });
    return el("ul", {}, items);
  }

  function operation(spec, path, verb, op, pathParams) {
    var params = (pathParams || []).concat(op.parameters || []);
    var body = [];
    if (op.description) { body.push(el("p", { text: op.description })); }
    var table = paramsTable(spec, params);
    if (table) { body.push(el("h4", { text: "Parameters" }), table); }
    if (op.requestBody) {
      var rb = op.requestBody.content && op.requestBody.content["application/json"];
      body.push(el("h4", { text: "Request body (JSON)" }));
      body.push(el("pre", { text: rb ? JSON.stringify(resolve(spec, rb.schema), null, 2) : "(none)" }));
    }
    body.push(el("h4", { text: "Responses" }), responsesList(spec, op.responses));
    return el("details", { class: "op" }, [
      el("summary", {}, [
        el("span", { class: "verb " + verb, text: verb.toUpperCase() }),
        el("span", { class: "path", text: path }),
        el("span", { class: "muted", text: op.summary || "" })
      ]),
      el("div", { class: "body" }, body)
    ]);
  }

  function render(spec) {
    document.getElementById("title").textContent = spec.info.title + " API";
    document.title = spec.info.title + " API";
    document.getElementById("version").textContent = "Version " + spec.info.version;
    document.getElementById("description").textContent = spec.info.description || "";

    var root = document.getElementById("ops");
    root.textContent = "";
    (spec.tags || []).forEach(function (tag) {
      var ops = [];
      Object.keys(spec.paths).forEach(function (path) {
        var item = spec.paths[path];
        ["get", "post", "put", "delete"].forEach(function (verb) {
          var op = item[verb];
          if (op && op.tags && op.tags.indexOf(tag.name) !== -1) {
            ops.push(operation(spec, path, verb, op, item.parameters));
          }
        });
      });
      if (!ops.length) { return; }
      root.appendChild(el("h2", { text: tag.name }));
      if (tag.description) { root.appendChild(el("p", { class: "muted", text: tag.description })); }
      ops.forEach(function (n) { root.appendChild(n); });
    });
  }

  fetch("docs/openapi.json", { headers: { "Accept": "application/json" } })
    .then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      document.getElementById("ops").textContent = "Could not load docs/openapi.json (" + err.message + ").";
    });
})();
</script>
</body>
</html>
