[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-rest"
version = "0.1.0"
description = "Restful API for Taskwarrior built with Flask and tasklib."
readme = "README.md"
requires-python = ">=3.14"
# Same version ranges as Pipfile [packages]; keep the two files in sync.
dependencies = [
    "flask>=3.1,<4",
    "werkzeug>=3.1,<4",
    "flask-restful>=0.3.10,<0.4",
    "marshmallow>=4.4,<5",
    "flask-cors>=6,<7",
    "pyjwt>=2.15,<3",
    # Taskwarrior 3 support lives in the emirhg fork of tasklib.
    "tasklib @ git+https://github.com/emirhg/tasklib.git@2c855bbd47849d3932336483381e82cf1355d92f",
]

[project.scripts]
task-rest = "task_rest.serve:main"

[tool.setuptools]
packages = ["task_rest"]
